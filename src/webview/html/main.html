<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${CspSrc}; script-src 'nonce-${Nonce}';">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="${StyleSrc}" rel="stylesheet">
    </head>
    <body>
        <li class="info">pack ya mod babes !!!</li>
        <button class="pack-button" title="Pack your mod, starting from '${WorkspacePath}'">PACK</button>

        <br>

        <br>

        <li class="info">click on these to convert files that the game expects to be binary.</li>
        <br>
        <div class="buttons-arrows">
            <button class="lsx-button left-button" title="also works on .lsfex files">*.lsx</button><div class="center-arrows"><-></div><button class="lsf-button right-button" title="also works on .lsfx files">*.lsf</button>
        </div>
        <br>

        <div class="buttons-arrows">
            <button class="locaxml-button left-button" title="">*.loca.xml</button><div class="center-arrows"><-></div><button class="loca-button right-button" title="">*.loca</button>
        </div>

        <br>

        <br>

        <li class="info">unpack ya mod babes !!!</li>
        <button class="unpack-button" title="Unpack a mod!">UNPACK</button>
        <script nonce="${Nonce}" src="${ScriptSrc}"></script>
    </body>
</html>
